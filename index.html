<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CHAOS CHAT CLOUD</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --sidebar-color: #1e293b;
            --chat-bg: #0f172a;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #f59e0b;
            --user-bubble: #3b82f6;
            --ai-bubble: #334155;
            --border-color: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; height: 100vh; height: 100dvh; overflow: hidden; }
        
        .sidebar { width: 280px; background-color: var(--sidebar-color); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 15px; transition: transform 0.3s; z-index: 10; }
        .sidebar h2 { font-size: 1rem; color: var(--accent-color); margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; }
        .new-chat-btn { background: var(--accent-color); color: #000; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 15px; width: 100%; }
        .chat-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
        .chat-item { padding: 10px; border-radius: 6px; cursor: pointer; color: var(--text-muted); font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-item:hover, .chat-item.active { background-color: var(--border-color); color: var(--text-color); }
        
        .sidebar-footer { border-top: 1px solid var(--border-color); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
        .action-btn { background: transparent; border: 1px solid var(--border-color); color: var(--text-muted); padding: 8px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; text-align: left; }
        .action-btn:hover { background-color: var(--border-color); color: var(--text-color); }

        .main-container { flex: 1; display: flex; flex-direction: column; height: 100%; background-color: var(--chat-bg); position: relative; }
        .chat-header { padding: 12px 20px; border-bottom: 1px solid var(--border-color); font-size: 1rem; font-weight: bold; display: flex; align-items: center; background-color: var(--sidebar-color); }
        .menu-toggle { background: none; border: none; color: var(--text-color); font-size: 1.2rem; cursor: pointer; display: none; margin-right: 10px; }
        
        .chat-messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
        .message { display: flex; gap: 12px; max-width: 800px; width: 100%; margin: 0 auto; line-height: 1.5; font-size: 0.95rem; }
        .message.user { flex-direction: row-reverse; }
        .avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.8rem; flex-shrink: 0; }
        .message.user .avatar { background-color: var(--user-bubble); color: white; }
        .message.ai .avatar { background-color: var(--accent-color); color: black; }
        
        .bubble { padding: 10px 14px; border-radius: 10px; word-break: break-word; }
        .message.user .bubble { background-color: var(--user-bubble); color: white; border-top-right-radius: 2px; }
        .message.ai .bubble { background-color: var(--ai-bubble); color: var(--text-color); border-top-left-radius: 2px; border: 1px solid var(--border-color); }

        .input-container { padding: 15px; border-top: 1px solid var(--border-color); background-color: var(--bg-color); }
        .input-box { max-width: 800px; margin: 0 auto; display: flex; background-color: var(--sidebar-color); border: 1px solid var(--border-color); border-radius: 12px; padding: 8px 12px; gap: 10px; align-items: flex-end; }
        textarea { flex: 1; background: transparent; border: none; color: var(--text-color); resize: none; height: 24px; max-height: 100px; outline: none; font-size: 0.95rem; line-height: 1.4; }
        .send-btn { background-color: var(--accent-color); border: none; width: 34px; height: 34px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #000; flex-shrink: 0; }

        @media (max-width: 768px) {
            .sidebar { position: absolute; height: 100%; transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .menu-toggle { display: block; }
        }
    </style>
</head>
<body>

    <div class="sidebar" id="sidebar">
        <h2>
            <span>⚡ CHAOS CLOUD</span>
            <span onclick="toggleSidebar()" style="cursor:pointer; font-size:1.2rem;">×</span>
        </h2>
        <button class="new-chat-btn" onclick="startNewChat()">＋ 新しいチャット</button>
        <div class="chat-list" id="chatList"></div>
        
        <div class="sidebar-footer">
            <button class="action-btn" onclick="exportData()">💾 会話データを保存</button>
        </div>
    </div>

    <div class="main-container">
        <div class="chat-header">
            <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
            <span id="currentTitle">新規セッション</span>
        </div>
        
        <div class="chat-messages" id="chatMessages"></div>

        <div class="input-container">
            <div class="input-box">
                <textarea id="userInput" placeholder="メッセージを入力..." rows="1" oninput="autoResize(this)" onkeydown="handleKeyDown(event)"></textarea>
                <button class="send-btn" onclick="sendMessage()">▶</button>
            </div>
        </div>
    </div>

    <script>
        let sessions = JSON.parse(localStorage.getItem('chaos_cloud_sessions')) || [{ id: Date.now(), title: '最初のチャット', messages: [] }];
        let currentSessionId = sessions[0].id;

        function saveSessions() {
            localStorage.setItem('chaos_cloud_sessions', JSON.stringify(sessions));
        }

        function renderSidebar() {
            const list = document.getElementById('chatList');
            list.innerHTML = '';
            sessions.forEach(s => {
                const div = document.createElement('div');
                div.className = `chat-item ${s.id === currentSessionId ? 'active' : ''}`;
                div.textContent = s.title;
                div.onclick = () => { switchSession(s.id); if(window.innerWidth <= 768) toggleSidebar(); };
                list.appendChild(div);
            });
        }

        function renderMessages() {
            const container = document.getElementById('chatMessages');
            container.innerHTML = '';
            
            const session = sessions.find(s => s.id === currentSessionId);
            document.getElementById('currentTitle').textContent = session.title;

            if (session.messages.length === 0) {
                container.innerHTML = `
                    <div class="message ai">
                        <div class="avatar">AI</div>
                        <div class="bubble">おう、よく来たな！キー入力なしですぐ繋がったぜ。今日はどんな話をしようか、何でもぶつけてこいよ！</div>
                    </div>
                `;
                return;
            }

            session.messages.forEach(msg => {
                const div = document.createElement('div');
                div.className = `message ${msg.role}`;
                div.innerHTML = `
                    <div class="avatar">${msg.role === 'user' ? '君' : 'AI'}</div>
                    <div class="bubble">${escapeHtml(msg.text).replace(/\n/g, '<br>')}</div>
                `;
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        function startNewChat() {
            const newS = { id: Date.now(), title: '新しいチャット', messages: [] };
            sessions.unshift(newS);
            currentSessionId = newS.id;
            saveSessions();
            renderSidebar();
            renderMessages();
            if(window.innerWidth <= 768) toggleSidebar();
        }

        function switchSession(id) {
            currentSessionId = id;
            renderSidebar();
            renderMessages();
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            const session = sessions.find(s => s.id === currentSessionId);
            if (session.messages.length === 0) {
                session.title = text.length > 15 ? text.substring(0, 15) + '...' : text;
            }

            session.messages.push({ role: 'user', text: text });
            input.value = '';
            input.style.height = '24px';
            saveSessions();
            renderMessages();
            renderSidebar();

            // サーバーレスAPIへリクエスト（キー不要で安全に通信）
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await response.json();
                const replyText = data.reply || "おい、変な返事が返ってきたぞ……！";
                session.messages.push({ role: 'ai', text: replyText });
            } catch (err) {
                session.messages.push({ role: 'ai', text: "おいおい、サーバーとの通信でエラーだ……デプロイ設定を確認しな！" });
            }

            saveSessions();
            renderMessages();
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(sessions, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `chaos_cloud_backup_${Date.now()}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        renderSidebar();
        renderMessages();
    </script>
</body>
</html>
