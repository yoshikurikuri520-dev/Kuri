<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <meta name="description" content="ログイン不要で使える、辛口・毒舌・たまにおちゃめなAI「よしくんGPT」" />
  <title>よしくんGPT</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="avatar" aria-hidden="true">😈</div>
        <div>
          <h1>よしくんGPT</h1>
          <p><span class="online"></span> ログイン不要</p>
        </div>
      </div>
      <button id="clearButton" class="ghost-button" type="button">会話を消す</button>
    </header>

    <main id="chat" class="chat" aria-live="polite">
      <section class="hero">
        <div class="hero-icon">😈</div>
        <h2>何でも聞け。</h2>
        <p>優しく答えるとは言ってねぇ。<br />でも役に立つ返事くらいはしてやる。</p>
        <div class="chips">
          <button class="chip" data-prompt="今日やるべきことを3つに整理して">今日の整理</button>
          <button class="chip" data-prompt="仕事のやる気が出ない。どうしたらいい？">やる気ゼロ</button>
          <button class="chip" data-prompt="このアイデアを辛口で評価して">辛口レビュー</button>
        </div>
      </section>
    </main>

    <footer class="composer-wrap">
      <form id="chatForm" class="composer">
        <textarea
          id="messageInput"
          rows="1"
          maxlength="3000"
          placeholder="よしくんに聞く…"
          aria-label="メッセージ"
        ></textarea>
        <button id="sendButton" class="send-button" type="submit" aria-label="送信">
          ➤
        </button>
      </form>
      <p class="fineprint">AIは間違うこともある。大事なことは自分でも確認しろ。</p>
    </footer>
  </div>

  <script src="/app.js" defer></script>
</body>
</html>
